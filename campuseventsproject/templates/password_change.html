{% extends 'base.html' %}
{% block title %}Change Password — CampusHub{% endblock %}

{% block content %}
<div style="max-width:420px; margin:3rem auto;">
    <h1 class="page-title mb-1">Change Password</h1>
    <p class="page-subtitle">Choose a new secure password</p>

    <div class="card">
        <form method="POST">
            {% csrf_token %}
            {% for field in form %}
            <div class="form-group">
                <label>{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <p style="color:var(--danger); font-size:0.8rem; margin-top:0.3rem;">{{ field.errors.0 }}</p>
                {% endif %}
            </div>
            {% endfor %}
            <div class="divider"></div>
            <div class="flex gap-3">
                <button type="submit" class="btn btn-primary">Update Password</button>
                <a href="{% url 'profile' %}" class="btn btn-ghost">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
